<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruby Maxiee AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #171316;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #21191c;
    border-right: 1px solid #49363b;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 25px;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #b96f82;
    display: flex;
    align-items: center;
    justify-content: center;
}

.new-chat {
    border: 1px solid #80515e;
    background: #39272c;
    color: white;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
}

.new-chat:hover {
    background: #4b3038;
}

.recent {
    margin-top: 30px;
    color: #aa9299;
    font-size: 13px;
}

.chat-item {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.chat-item:hover {
    background: #332428;
}

.settings {
    margin-top: auto;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
}

.settings:hover {
    background: #332428;
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    height: 65px;
    border-bottom: 1px solid #49363b;
    display: flex;
    align-items: center;
    padding: 0 25px;
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-left: 10px;
    font-size: 11px;
    color: #9dd6a8;
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 15%;
}

.welcome {
    text-align: center;
    margin-top: 8%;
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #b96f82;
    margin-bottom: 18px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.welcome p {
    color: #bcaab0;
    margin-bottom: 30px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 650px;
    margin: auto;
}

.card {
    background: #241b1e;
    border: 1px solid #49363b;
    padding: 18px;
    border-radius: 14px;
    text-align: left;
    cursor: pointer;
}

.card:hover {
    border-color: #b96f82;
    background: #2e2226;
}

.message {
    max-width: 750px;async function sendMessage() {

    const input = document.getElementById("message");
    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addMessage(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message bot";
    loading.innerText = "Ruby Maxiee is thinking... 🌹";

    document.getElementById("chat").appendChild(loading);

    try {

        const response = await fetch(
            "https://rubi-2abg.onrender.com/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text,
                    history: []
                })
            }
        );

        const data = await response.json();

        loading.remove();

        if (data.response) {

            addMessage(data.response, "bot");

        } else {

            addMessage(
                "Ruby Maxiee couldn't generate a response 😭",
                "bot"
            );

            console.error(data);
        }

    } catch (error) {

        loading.innerText =
            "Connection problem da 😭 Please try again.";

        console.error(error);
    }
        }
    margin: 15px auto;
    padding: 15px 18px;
    border-radius: 15px;
    line-height: 1.5;
}

.user {
    background: #49303a;
    margin-left: auto;
    width: fit-content;
}

.bot {
    background: #241b1e;
    border: 1px solid #49363b;
}

/* INPUT */
.input-area {
    padding: 15px 15%;
    border-top: 1px solid #49363b;
}

.input-box {
    background: #241b1e;
    border: 1px solid #60434b;
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 8px 12px;
}

.input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 12px;
}

.button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 12px;
    background: #b96f82;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.button:hover {
    background: #ce8295;
}

/* MOBILE */
@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .chat {
        padding: 25px 15px;
    }

    .input-area {
        padding: 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .welcome h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">🌹</div>
            Ruby Maxiee
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="recent">RECENT</div>

        <div id="history"></div>

        <div class="settings">
            ⚙️ Settings
        </div>

    </aside>


    <main class="main">

        <header class="header">
            Ruby Maxiee
            <span class="status">● Online</span>
        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <!-- Upload your mascot as ruby-mascot.jpg -->
                <img
                    src="ruby-mascot.jpg"
                    class="avatar"
                    onerror="this.style.display='none'"
                >

                <h1>Hey 👋 I'm Ruby Maxiee</h1>

                <p>Your personal AI assistant.</p>

                <div class="cards">

                    <div class="card"
                         onclick="sendSuggestion('Explain Python to me')">
                        🐍 Explain Python to me
                    </div>

                    <div class="card"
                         onclick="sendSuggestion('Help me learn AI')">
                        🤖 Help me learn AI
                    </div>

                    <div class="card"
                         onclick="sendSuggestion('Write some code')">
                        💻 Write some code
                    </div>

                    <div class="card"
                         onclick="sendSuggestion('Give me a study plan')">
                        📚 Give me a study plan
                    </div>

                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <button class="button"
                        onclick="document.getElementById('file').click()">
                    ＋
                </button>

                <input
                    id="message"
                    type="text"
                    placeholder="Message Ruby Maxiee..."
                    onkeydown="handleEnter(event)"
                >

                <input
                    id="file"
                    type="file"
                    hidden
                >

                <button class="button" onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script>
let chatHistory = [];

async function sendMessage() {
    const input = document.getElementById("message");
    const text = input.value.trim();

    if (!text) return;

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    addMessage(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message bot";
    loading.innerText = "Ruby Maxiee is thinking... 🌹";
    document.getElementById("chat").appendChild(loading);

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                history: chatHistory
            })
        });

        const data = await response.json();
        loading.remove();

        if (data.response) {
            addMessage(data.response, "bot");
            chatHistory.push({ role: "user", content: text });
            chatHistory.push({ role: "assistant", content: data.response });
        } else {
            addMessage(
                "Ruby Maxiee couldn't generate a response 😭\n" +
                (data.error || "Unknown server error"),
                "bot"
            );
            console.error(data);
        }
    } catch (error) {
        loading.innerText = "Connection problem da 😭 Please try again.";
        console.error(error);
    }
}

function addMessage(text, type) {
    const chat = document.getElementById("chat");
    const message = document.createElement("div");

    message.className = "message " + type;
    message.innerText = text;

    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}

function sendSuggestion(text) {
    document.getElementById("message").value = text;
    sendMessage();
}

function handleEnter(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

function newChat() {
    location.reload();
}
</script>

</body>
</html>
